[project]
name = "games"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne==4.2.2",
    "django==6.0.6",
    "uvicorn[standard]==0.49.0",
    "whitenoise>=6.11.0",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "django-stubs==5.2.9",
    "mypy==1.19.1",
    "ruff==0.14.10",
]

[tool.black]
target-version = ["py314"]
extend-exclude = '''
/\.data/
'''

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"

[tool.django-stubs]
django_settings_module = "games.settings"
