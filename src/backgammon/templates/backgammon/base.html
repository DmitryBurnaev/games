{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Длинные нарды{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'backgammon/game.css' %}?v=12" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% url 'backgammon:game_list' %}">Длинные нарды</a>
            <div class="ms-auto d-flex align-items-center gap-3">
                {% if user.is_authenticated %}
                    <span class="text-secondary small">{{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-secondary btn-sm" type="submit">Выйти</button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-secondary btn-sm" href="{% url 'login' %}">Войти</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} mb-3">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
