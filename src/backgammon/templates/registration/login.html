{% extends 'backgammon/base.html' %}

{% block title %}Вход · Длинные нарды{% endblock %}

{% block content %}
<div class="auth-panel mx-auto">
    <h1 class="h4 mb-3">Вход</h1>
    <form method="post" class="vstack gap-3">
        {% csrf_token %}
        {{ form.as_div }}
        <button class="btn btn-primary" type="submit">Войти</button>
    </form>
    {% if allow_user_registration %}
        <div class="mt-3">
            <a href="{% url 'backgammon:signup' %}">Создать аккаунт</a>
        </div>
    {% endif %}
</div>
{% endblock %}
