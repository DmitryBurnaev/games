{% extends 'backgammon/base.html' %}

{% block title %}Регистрация · Длинные нарды{% endblock %}

{% block content %}
<div class="auth-panel mx-auto">
    <h1 class="h4 mb-3">Регистрация</h1>
    <form method="post" class="vstack gap-3">
        {% csrf_token %}
        {{ form.as_div }}
        <button class="btn btn-primary" type="submit">Создать аккаунт</button>
    </form>
    <div class="mt-3">
        <a href="{% url 'login' %}">Уже есть аккаунт</a>
    </div>
</div>
{% endblock %}
