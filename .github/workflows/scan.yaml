name: Scan

on:
  push:
    branches:
      - "main"
      - "feature/49-project-quality-checks" # Temporary: validate scan changes before merge.
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

env:
  DOCKER_IMAGE: games:scan-${{ github.sha }}
  TRIVY_VERSION: "v0.76.2"
  # SHA-256 of the Linux x86-64 archive, from the immutable upstream release.
  TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
  TRIVY_SEVERITY: "CRITICAL,HIGH,MEDIUM,LOW"
  OPENGREP_VERSION: "v1.11.2"
  OPENGREP_RULES_REVISION: "f1d2b562b414783763fd02a6ed2736eaed622efa"
  OPENGREP_EXCLUDE_RULES: ".github/scan/opengrep-exclude-rules.txt"
  TRUFFLEHOG_VERSION: "v3.90.12"
  GITLEAKS_VERSION: "v8.28.0"
  GITLEAKS_IGNORE_PATH: ".github/scan/gitleaks-ignore.txt"

jobs:
  trivy:
    name: trivy ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: image
            artifact: trivy-image
          - target: filesystem
            artifact: trivy-fs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Trivy release
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/trivy.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" \
            -o "${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" trivy
          "${RUNNER_TEMP}/trivy" --version

      - name: Build service image
        if: matrix.target == 'image'
        run: docker build --target service --tag "${DOCKER_IMAGE}" .

      - name: Scan image (report)
        if: matrix.target == 'image'
        run: |
          "${RUNNER_TEMP}/trivy" image --scanners vuln --severity "${TRIVY_SEVERITY}" \
            --exit-code 0 --format json --output "${RUNNER_TEMP}/trivy-results.json" "${DOCKER_IMAGE}"
          jq -e 'type == "object" and has("SchemaVersion")' "${RUNNER_TEMP}/trivy-results.json" > /dev/null

      - name: Scan filesystem (report)
        if: matrix.target == 'filesystem'
        run: |
          "${RUNNER_TEMP}/trivy" fs --scanners vuln,misconfig --include-dev-deps --severity "${TRIVY_SEVERITY}" \
            --exit-code 0 --format json --output "${RUNNER_TEMP}/trivy-results.json" .
          jq -e 'type == "object" and has("SchemaVersion")' "${RUNNER_TEMP}/trivy-results.json" > /dev/null

      - name: Upload scan results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: "${{ runner.temp }}/trivy-results.json"
          retention-days: 60
          if-no-files-found: error

      - name: Scan image (alert)
        if: matrix.target == 'image'
        run: |
          "${RUNNER_TEMP}/trivy" image --scanners vuln --severity "${TRIVY_SEVERITY}" \
            --exit-code 1 "${DOCKER_IMAGE}"

      - name: Scan filesystem (alert)
        if: matrix.target == 'filesystem'
        run: |
          "${RUNNER_TEMP}/trivy" fs --scanners vuln,misconfig --include-dev-deps --severity "${TRIVY_SEVERITY}" \
            --exit-code 1 .

  trufflehog:
    name: trufflehog
    runs-on: ubuntu-24.04
    steps:
      - name: Install Trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin ${{ env.TRUFFLEHOG_VERSION }}

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Trufflehog FS (report)
        run: |
          trufflehog filesystem "${{ github.workspace }}" --results=verified,unknown --json > "${{ runner.temp }}/trufflehog-results.json"

      - name: Upload scan results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trufflehog-results
          path: "${{ runner.temp }}/trufflehog-results.json"
          retention-days: 60

      - name: Run Trufflehog FS (alert)
        run: |
          trufflehog filesystem "${{ github.workspace }}" --results=verified,unknown --fail --github-actions

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Install GitLeaks
        run: |
          git clone --branch ${{ env.GITLEAKS_VERSION }} https://github.com/gitleaks/gitleaks.git /home/runner/.gitleaks
          cd /home/runner/.gitleaks
          make build

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks (report)
        run: |
          export PATH='/home/runner/.gitleaks':$PATH
          gitleaks git . --gitleaks-ignore-path "${GITLEAKS_IGNORE_PATH}" --redact=100 --exit-code 0 --report-format json --report-path "${{ runner.temp }}/gitleaks-results.json"

      - name: Upload scan results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gitleaks-results
          path: "${{ runner.temp }}/gitleaks-results.json"
          retention-days: 60

      - name: Run Gitleaks (alert)
        run: |
          export PATH='/home/runner/.gitleaks':$PATH
          gitleaks git . --gitleaks-ignore-path "${GITLEAKS_IGNORE_PATH}" --redact=100 --verbose

  opengrep:
    name: opengrep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Opengrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash -s -- -v ${{ env.OPENGREP_VERSION }}

      - name: Clone Opengrep Rules
        run: |
          git clone https://github.com/opengrep/opengrep-rules.git
          git -C opengrep-rules checkout --detach "${OPENGREP_RULES_REVISION}"

      - name: Run Opengrep Scan (report)
        run: |
          export PATH='/home/runner/.opengrep/cli/latest':$PATH
          OPENGREP_EXCLUDE_ARGS="$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' "${OPENGREP_EXCLUDE_RULES}" | xargs -I{} printf ' --exclude-rule %s' '{}')"
          opengrep scan --config opengrep-rules/python ${OPENGREP_EXCLUDE_ARGS} --json -o "${{ runner.temp }}/opengrep-results.json" .

      - name: Upload scan results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: opengrep-results
          path: "${{ runner.temp }}/opengrep-results.json"
          retention-days: 60

      - name: Run Opengrep Scan (alert)
        run: |
          export PATH='/home/runner/.opengrep/cli/latest':$PATH
          OPENGREP_EXCLUDE_ARGS="$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' "${OPENGREP_EXCLUDE_RULES}" | xargs -I{} printf ' --exclude-rule %s' '{}')"
          opengrep scan --config opengrep-rules/python ${OPENGREP_EXCLUDE_ARGS} --strict --error .
