upstream games_app {
    server localhost:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name games.example.com;

    server_tokens off;

    access_log /var/log/nginx/games.log;
    error_log  /var/log/nginx/games-error.log;

    add_header 'Strict-Transport-Security' "max-age=31536000" always;
    add_header 'X-Frame-Options' "SAMEORIGIN" always;
    add_header 'X-Xss-Protection' "1; mode=block" always;
    add_header 'X-Content-Type-Options' "nosniff" always;
    add_header 'Referrer-Policy' 'strict-origin' always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /gadm/ {
        # Optional admin allowlist. Uncomment and replace the example IP
        # address to make /gadm/ reachable only from a trusted address.
        #
        # allow 203.0.113.10;
        # deny all;

        proxy_pass http://games_app;
    }

    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_pass http://games_app;
    }

    location / {
        proxy_pass http://games_app;
    }
}
