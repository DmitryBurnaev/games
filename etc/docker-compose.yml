services:
  app:
    image: ${DOCKER_IMAGE}
    container_name: games-app
    env_file:
      - .env
    environment:
      APP_SERVICE: app
      APP_VERSION: ${APP_VERSION:-develop}
      SQLITE_PATH: /app/.data/db.sqlite3
      REDIS_URL: redis://redis:6379/0
    ports:
      - 127.0.0.1:${APP_PORT}:${APP_PORT}
    volumes:
      - ${PWD}/.data:/app/.data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:$${APP_PORT}/health/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: games-redis
